<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSBD | Premium Admin Terminal</title>
    <link rel="icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #0f172a; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-style { background: #1e293b; border: 1px solid #334155; padding: 12px 16px; border-radius: 12px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        .btn-emerald { background: #10b981; transition: 0.3s; color: white; }
        .btn-emerald:hover { background: #059669; transform: translateY(-2px); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Login Overlay -->
    <div id="login-box" class="fixed inset-0 bg-[#0f172a] z-[5000] flex items-center justify-center p-6">
        <div class="glass w-full max-w-md p-8 rounded-[32px] text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-500/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-emerald-500/20">
                <i class="fas fa-user-shield text-3xl text-emerald-500"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">এডমিন লগইন</h2>
            <p class="text-slate-400 text-xs mb-8">সিস্টেম অ্যাক্সেস করতে আপনার সিক্রেট কোড দিন</p>
            <input type="password" id="passInput" placeholder="••••••••••••" class="input-style text-center tracking-[8px] mb-4">
            <button onclick="login()" class="w-full btn-emerald py-4 rounded-2xl font-bold shadow-lg shadow-emerald-500/20">ভেরিফাই করুন</button>
        </div>
    </div>

    <!-- Main Admin Dashboard -->
    <div id="content" class="hidden">
        <!-- Top Nav -->
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <img src="logo.png" class="w-10 h-10 rounded-xl" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2912/2912761.png'">
                <div>
                    <h1 class="text-sm font-bold leading-none">DSBD Terminal</h1>
                    <span class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest">Management System</span>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors">
                <i class="fas fa-sync-alt text-sm"></i>
            </button>
        </nav>

        <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Settings & Forms -->
            <div class="lg:col-span-1 space-y-8">
                <!-- Payment Update Card -->
                <div class="glass p-6 rounded-[28px]">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-emerald-500 mb-4">পেমেন্ট সেটিংস</h3>
                    <div class="space-y-3">
                        <input type="text" id="payNum" placeholder="বিকাশ/নগদ নম্বর" class="input-style text-sm">
                        <button onclick="updatePayment()" class="w-full btn-emerald py-3 rounded-xl font-bold text-xs uppercase tracking-widest">নম্বর আপডেট করুন</button>
                        <p id="currentPayNum" class="text-[10px] text-slate-500 text-center italic"></p>
                    </div>
                </div>

                <!-- Product Form Card -->
                <div class="glass p-6 rounded-[28px]">
                    <h3 id="form-title" class="text-xs font-bold uppercase tracking-widest text-emerald-500 mb-4">সার্ভিস ম্যানেজমেন্ট</h3>
                    <div class="space-y-4">
                        <input type="hidden" id="pid">
                        <input type="text" id="pTitle" placeholder="সার্ভিসের নাম" class="input-style text-sm">
                        <textarea id="pDesc" placeholder="সার্ভিস বর্ণনা" class="input-style text-sm h-20 resize-none"></textarea>
                        <input type="text" id="pImg" placeholder="ছবির ডিরেক্ট লিঙ্ক (URL)" class="input-style text-sm">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="pPdf" placeholder="PDF মূল্য" class="input-style text-sm">
                            <input type="number" id="pPrint" placeholder="Hard মূল্য" class="input-style text-sm">
                        </div>
                        <button id="pBtn" onclick="save()" class="w-full btn-emerald py-4 rounded-xl font-bold text-xs uppercase tracking-widest">পাবলিশ করুন</button>
                        <button id="cancelBtn" onclick="resetForm()" class="hidden w-full text-[10px] text-red-400 font-bold uppercase tracking-widest mt-2 underline">এডিট বাতিল করুন</button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Lists -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- Stats Overview -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass p-6 rounded-[28px] text-center border-l-4 border-emerald-500">
                        <p class="text-[10px] uppercase font-bold text-slate-400">মোট প্রোডাক্ট</p>
                        <h4 id="count-products" class="text-2xl font-bold">0</h4>
                    </div>
                    <div class="glass p-6 rounded-[28px] text-center border-l-4 border-blue-500">
                        <p class="text-[10px] uppercase font-bold text-slate-400">মোট অর্ডার</p>
                        <h4 id="count-orders" class="text-2xl font-bold">0</h4>
                    </div>
                </div>

                <!-- Live Orders Section -->
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest text-emerald-500 mb-4 flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> লাইভ অর্ডার তালিকা
                    </h3>
                    <div id="order-list" class="space-y-4">
                        <!-- Orders will be loaded here -->
                    </div>
                </div>

                <!-- Product List Section -->
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest text-blue-500 mb-4">বিদ্যমান সার্ভিসসমূহ</h3>
                    <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Products will be loaded here -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Firebase Config (Original)
        const firebaseConfig = {
            apiKey: "AIzaSyAixef88AV6RvG0OJmAsm-Us1J3iaUwJIk",
            authDomain: "designworkbd94-76817.firebaseapp.com",
            databaseURL: "https://designworkbd94-76817-default-rtdb.firebaseio.com",
            projectId: "designworkbd94-76817",
            storageBucket: "designworkbd94-76817.firebasestorage.app",
            messagingSenderId: "998861158372",
            appId: "1:998861158372:web:822d38c710d109e6ad79f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // আপনার দেওয়া সিক্রেট কোড
        const SECRET_CODE = "DSBD-ADMIN-99-SECURE-!#";

        function login() {
            const input = document.getElementById('passInput').value;
            if(input === SECRET_CODE) {
                document.getElementById('login-box').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('content').classList.remove('hidden');
                    init();
                }, 300);
            } else {
                alert('ভুল সিক্রেট কোড! আবার চেষ্টা করুন।');
            }
        }

        function init() {
            // Load Payment Number
            db.ref('settings/paymentNum').on('value', snap => {
                document.getElementById('currentPayNum').innerText = "বর্তমান নম্বর: " + (snap.val() || "সেট করা নেই");
            });

            // Load & Count Products
            db.ref('products').on('value', snap => {
                const list = document.getElementById('product-list');
                const products = snap.val();
                list.innerHTML = '';
                let count = 0;
                
                if(products) {
                    Object.keys(products).forEach(id => {
                        count++;
                        list.innerHTML += `
                        <div class="glass p-4 rounded-2xl flex items-center gap-4 border-l-4 border-slate-600">
                            <img src="${products[id].img}" class="w-12 h-12 rounded-xl object-cover shadow-lg">
                            <div class="flex-1 min-w-0">
                                <h5 class="text-xs font-bold truncate">${products[id].title}</h5>
                                <p class="text-[9px] text-slate-500 uppercase mt-1">৳${products[id].pdfPrice} / ৳${products[id].printPrice}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editProduct('${id}')" class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white transition-all"><i class="fas fa-edit text-[10px]"></i></button>
                                <button onclick="deleteProduct('${id}')" class="w-8 h-8 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                        </div>`;
                    });
                }
                document.getElementById('count-products').innerText = count;
            });

            // Load & Count Orders
            db.ref('orders').on('value', snap => {
                const list = document.getElementById('order-list');
                const orders = snap.val();
                list.innerHTML = '';
                let count = 0;

                if(orders) {
                    Object.keys(orders).reverse().forEach(id => {
                        count++;
                        let o = orders[id];
                        let statusClass = o.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : o.status === 'Processing' ? 'bg-blue-500/10 text-blue-500 border-blue-500/20' : 'bg-orange-500/10 text-orange-500 border-orange-500/20';
                        
                        list.innerHTML += `
                        <div class="glass p-5 rounded-[24px] border-l-4 border-emerald-500 shadow-sm">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h4 class="font-bold text-sm text-emerald-400">${o.productTitle}</h4>
                                    <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">${o.orderType} COPY</p>
                                </div>
                                <span class="px-3 py-1 rounded-full text-[9px] font-bold border ${statusClass} uppercase tracking-widest">${o.status}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-[11px] mb-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                                <div>
                                    <p class="text-slate-500 uppercase text-[9px] font-bold">কাস্টমার নাম</p>
                                    <p class="font-semibold">${o.customerName}</p>
                                </div>
                                <div>
                                    <p class="text-slate-500 uppercase text-[9px] font-bold">ফোন নম্বর</p>
                                    <p class="font-semibold">${o.customerPhone}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <select onchange="updateStatus('${id}', this.value)" class="flex-1 bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest outline-none">
                                    <option value="Pending" ${o.status=='Pending'?'selected':''}>Set Pending</option>
                                    <option value="Processing" ${o.status=='Processing'?'selected':''}>Set Processing</option>
                                    <option value="Completed" ${o.status=='Completed'?'selected':''}>Set Completed</option>
                                </select>
                                <button onclick="deleteOrder('${id}')" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-trash-alt text-[11px]"></i></button>
                            </div>
                        </div>`;
                    });
                } else {
                    list.innerHTML = '<p class="text-center text-xs text-slate-500 py-6 italic">বর্তমানে কোনো অর্ডার নেই!</p>';
                }
                document.getElementById('count-orders').innerText = count;
            });
        }

        function save() {
            const id = document.getElementById('pid').value;
            const title = document.getElementById('pTitle').value;
            const img = document.getElementById('pImg').value;
            if(!title || !img) return alert('নাম এবং ছবির লিঙ্ক অবশ্যই দিতে হবে!');

            const data = { 
                title: title, desc: document.getElementById('pDesc').value, 
                img: img, pdfPrice: document.getElementById('pPdf').value || 0, printPrice: document.getElementById('pPrint').value || 0
            };
            if(id) db.ref('products/'+id).update(data); else db.ref('products').push(data);
            resetForm();
            alert('সফলভাবে সেভ করা হয়েছে!');
        }

        function editProduct(id) {
            db.ref('products/'+id).once('value', snap => {
                const p = snap.val();
                document.getElementById('pid').value = id;
                document.getElementById('pTitle').value = p.title;
                document.getElementById('pDesc').value = p.desc;
                document.getElementById('pImg').value = p.img;
                document.getElementById('pPdf').value = p.pdfPrice;
                document.getElementById('pPrint').value = p.printPrice;
                document.getElementById('pBtn').innerText = "আপডেট করুন";
                document.getElementById('cancelBtn').classList.remove('hidden');
                document.getElementById('product-form').scrollIntoView();
            });
        }

        function updateStatus(id, newStatus) { db.ref('orders/'+id).update({status: newStatus}); }
        function deleteOrder(id) { if(confirm('অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান?')) db.ref('orders/'+id).remove(); }
        function deleteProduct(id) { if(confirm('সার্ভিসটি ডিলিট করতে চান?')) db.ref('products/'+id).remove(); }
        function updatePayment() { db.ref('settings/paymentNum').set(document.getElementById('payNum').value).then(() => alert('পেমেন্ট নম্বর আপডেট হয়েছে!')); }
        function resetForm() { document.getElementById('pid').value = ''; document.getElementById('pTitle').value = ''; document.getElementById('pDesc').value = ''; document.getElementById('pImg').value = ''; document.getElementById('pPdf').value = ''; document.getElementById('pPrint').value = ''; document.getElementById('pBtn').innerText = "পাবলিশ করুন"; document.getElementById('cancelBtn').classList.add('hidden'); }
    </script>
</body>
</html>
