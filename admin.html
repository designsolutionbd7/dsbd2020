<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSBD | Advanced Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #020617; color: white; }
        .tab { display: none; } .tab.active { display: block; }
        .input-box { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; width: 100%; color: white; margin-bottom: 10px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }
        .btn-side { width: 100%; text-align: left; padding: 12px; border-radius: 12px; margin-bottom: 5px; transition: 0.3s; font-size: 13px; }
        .btn-side:hover, .btn-side.active { background: #f97316; color: white; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }
        .card { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Login Overlay -->
    <div id="login-box" class="fixed inset-0 bg-[#020617] z-[2000] flex items-center justify-center">
        <div class="bg-[#0f172a] p-8 rounded-3xl w-full max-w-sm text-center border border-orange-500/10 shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-orange-500 italic uppercase">DSBD Master Access</h2>
            <input type="password" id="passInput" placeholder="সিক্রেট কোড দিন" class="input-box text-center tracking-[5px]">
            <button onclick="login()" class="w-full bg-orange-600 py-3 rounded-xl font-bold hover:bg-orange-700 transition">প্রবেশ করুন</button>
        </div>
    </div>

    <div id="admin-content" class="hidden flex flex-col md:flex-row w-full">
        <!-- Sidebar -->
        <div class="w-full md:w-72 bg-[#0f172a] border-r border-white/5 p-6 overflow-y-auto">
            <div class="flex items-center gap-3 mb-8">
                <img id="admin-logo-preview" src="logo.png" class="w-10 h-10 rounded-full border border-orange-500">
                <h2 class="text-orange-500 font-bold italic uppercase tracking-wider">DSBD Master</h2>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('orders')" class="btn-side active" id="btn-orders"><i class="fas fa-shopping-cart mr-2"></i> অর্ডার ম্যানেজমেন্ট</button>
                <button onclick="switchTab('deliveries')" class="btn-side" id="btn-deliveries"><i class="fas fa-images mr-2"></i> ডেলিভারি প্রুফ</button>
                <button onclick="switchTab('inventory')" class="btn-side" id="btn-inventory"><i class="fas fa-box-open mr-2"></i> প্রোডাক্ট ও ক্যাটাগরি</button>
                <button onclick="location.reload()" class="btn-side mt-10 text-red-400"><i class="fas fa-power-off mr-2"></i> লগআউট</button>
            </nav>
        </div>

        <div class="flex-1 p-6 md:p-10 overflow-y-auto">
            
            <!-- Orders Tab -->
            <div id="tab-orders" class="tab active">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">অর্ডারসমূহ</h3>
                    <input type="text" id="orderSearch" placeholder="নাম/ফোন দিয়ে খুঁজুন..." class="bg-[#0f172a] border border-white/10 px-4 py-2 rounded-xl text-xs outline-none" onkeyup="filterOrders()">
                </div>
                <div id="order-list" class="space-y-4"></div>
            </div>

            <!-- Inventory Tab -->
            <div id="tab-inventory" class="tab">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">প্রোডাক্ট ও ক্যাটাগরি</h3>
                    <div class="flex gap-2">
                        <input type="text" id="newCat" placeholder="নতুন ক্যাটাগরি..." class="bg-[#0f172a] border border-white/10 px-4 py-2 rounded-xl text-xs outline-none">
                        <button onclick="addCategory()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs">+</button>
                    </div>
                </div>
                <div class="card mb-8">
                    <input type="hidden" id="pid">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="pTitle" placeholder="প্রোডাক্ট নাম" class="input-box">
                        <input type="text" id="pImg" placeholder="ছবির লিঙ্ক" class="input-box">
                        <select id="pCat" class="input-box">
                            <option value="General">General</option>
                        </select>
                    </div>
                    <textarea id="pDesc" placeholder="ডেসক্রিপশন" class="input-box h-20"></textarea>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="number" id="pCost" placeholder="কেনা দাম" class="input-box">
                        <input type="number" id="pPdf" placeholder="PDF মূল্য" class="input-box">
                        <input type="number" id="pPrint" placeholder="Hard Copy মূল্য" class="input-box">
                        <input type="number" id="pStock" placeholder="স্টক" class="input-box">
                    </div>
                    <button onclick="saveProduct()" id="saveBtn" class="w-full bg-orange-600 py-3 rounded-xl font-bold">সেভ / আপডেট করুন</button>
                </div>
                <div id="inventory-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Deliveries Tab -->
            <div id="tab-deliveries" class="tab">
                <h3 class="text-xl font-bold mb-6">ডেলিভারি প্রুফ</h3>
                <div class="card mb-8 flex gap-4">
                    <input type="text" id="deliveryImgUrl" placeholder="ইমেজ লিঙ্ক..." class="input-box mb-0">
                    <button onclick="addDeliveryPhoto()" class="bg-orange-600 px-6 rounded-xl font-bold">অ্যাড</button>
                </div>
                <div id="delivery-admin-list" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAixef88AV6RvG0OJmAsm-Us1J3iaUwJIk",
            authDomain: "designworkbd94-76817.firebaseapp.com",
            databaseURL: "https://designworkbd94-76817-default-rtdb.firebaseio.com",
            projectId: "designworkbd94-76817",
            storageBucket: "designworkbd94-76817.firebasestorage.app",
            messagingSenderId: "998861158372",
            appId: "1:998861158372:web:822d38c710d109e6ad79f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SECRET = "DWBD-ADMIN-99-SECURE-!#";

        function login() { if(document.getElementById('passInput').value === SECRET) { document.getElementById('login-box').style.display='none'; document.getElementById('admin-content').classList.remove('hidden'); init(); } else alert('ভুল পাসওয়ার্ড!'); }

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.btn-side').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            document.getElementById('btn-'+t).classList.add('active');
            if(t === 'deliveries') loadDeliveriesAdmin();
        }

        function init() {
            loadOrders();
            loadProducts();
            loadCategories();
        }

        // --- অর্ডার হ্যান্ডলিং ---
        function loadOrders() {
            db.ref('orders').on('value', snap => {
                const list = document.getElementById('order-list'); list.innerHTML = '';
                snap.forEach(c => {
                    const o = c.val(); const id = c.key;
                    list.innerHTML += `<div class="bg-[#0f172a] p-4 rounded-xl flex justify-between border-l-4 border-orange-500 order-item" data-search="${o.customerName} ${o.customerPhone}">
                        <div><h4 class="font-bold text-orange-400">${o.productTitle}</h4><p class="text-xs">${o.customerName} (${o.customerPhone})</p></div>
                        <button onclick="if(confirm('Delete?')) db.ref('orders/${id}').remove()" class="text-red-500"><i class="fas fa-trash"></i></button>
                    </div>`;
                });
            });
        }

        function filterOrders() {
            let q = document.getElementById('orderSearch').value.toLowerCase();
            document.querySelectorAll('.order-item').forEach(item => {
                item.style.display = item.getAttribute('data-search').toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        // --- প্রোডাক্ট হ্যান্ডলিং (Edit/Delete Fixed) ---
        function loadProducts() {
            db.ref('products').on('value', snap => {
                const list = document.getElementById('inventory-list'); list.innerHTML = '';
                snap.forEach(c => {
                    const p = c.val(); const id = c.key;
                    list.innerHTML += `<div class="bg-[#0f172a] p-4 rounded-xl flex items-center gap-4 border border-white/5">
                        <img src="${p.img}" class="w-10 h-10 rounded shadow-lg">
                        <div class="flex-1"><p class="text-xs font-bold">${p.title}</p></div>
                        <div class="flex gap-3">
                            <button onclick="editProduct('${id}')" class="text-blue-400"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct('${id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            });
        }

        function saveProduct() {
            const id = document.getElementById('pid').value;
            const data = {
                title: document.getElementById('pTitle').value,
                img: document.getElementById('pImg').value,
                cat: document.getElementById('pCat').value,
                desc: document.getElementById('pDesc').value,
                cost: document.getElementById('pCost').value,
                pdfPrice: document.getElementById('pPdf').value,
                printPrice: document.getElementById('pPrint').value,
                stock: document.getElementById('pStock').value
            };
            if(!data.title || !data.img) return alert("পুরো ফর্ম পূরণ করুন");

            if(id) {
                db.ref('products/' + id).update(data).then(() => { alert("Updated!"); resetForm(); });
            } else {
                db.ref('products').push(data).then(() => { alert("Saved!"); resetForm(); });
            }
        }

        function editProduct(id) {
            db.ref('products/' + id).once('value', snap => {
                const p = snap.val();
                document.getElementById('pid').value = id;
                document.getElementById('pTitle').value = p.title;
                document.getElementById('pImg').value = p.img;
                document.getElementById('pCat').value = p.cat || 'General';
                document.getElementById('pDesc').value = p.desc || '';
                document.getElementById('pCost').value = p.cost || '';
                document.getElementById('pPdf').value = p.pdfPrice || '';
                document.getElementById('pPrint').value = p.printPrice || '';
                document.getElementById('pStock').value = p.stock || '';
                document.getElementById('saveBtn').innerText = "আপডেট করুন";
                window.scrollTo(0,0);
            });
        }

        function deleteProduct(id) { if(confirm('Delete Product?')) db.ref('products/' + id).remove(); }

        function resetForm() {
            document.getElementById('pid').value = '';
            document.querySelectorAll('.input-box').forEach(i => i.value = '');
            document.getElementById('saveBtn').innerText = "সেভ / আপডেট করুন";
        }

        // --- ক্যাটাগরি হ্যান্ডলিং ---
        function addCategory() {
            const name = document.getElementById('newCat').value;
            if(name) db.ref('categories').push(name).then(() => document.getElementById('newCat').value = '');
        }

        function loadCategories() {
            db.ref('categories').on('value', snap => {
                const sel = document.getElementById('pCat');
                sel.innerHTML = '<option value="General">General</option>';
                snap.forEach(c => {
                    sel.innerHTML += `<option value="${c.val()}">${c.val()}</option>`;
                });
            });
        }

        // --- ডেলিভারি প্রুফ ---
        function addDeliveryPhoto() {
            const url = document.getElementById('deliveryImgUrl').value;
            if(url) db.ref('deliveries').push(url).then(() => document.getElementById('deliveryImgUrl').value = '');
        }

        function loadDeliveriesAdmin() {
            db.ref('deliveries').on('value', snap => {
                const list = document.getElementById('delivery-admin-list'); list.innerHTML = '';
                snap.forEach(c => {
                    list.innerHTML += `<div class="relative group"><img src="${c.val()}" class="w-full h-24 object-cover rounded-lg border border-white/10">
                    <button onclick="db.ref('deliveries/${c.key}').remove()" class="absolute inset-0 bg-red-600/80 text-white opacity-0 group-hover:opacity-100 rounded-lg text-xs">Delete</button></div>`;
                });
            });
        }
    </script>
</body>
</html>
